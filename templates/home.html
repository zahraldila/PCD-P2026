{% extends "base.html" %}
{% block title %}Home{% endblock %}

{% block content %}
<div class="container mt-5">

  <!-- ========================= -->
  <!-- Upload Image -->
  <!-- ========================= -->
  <h2 class="text-center">Unggah Citra Digital</h2>

  <form action="/upload/" method="post" enctype="multipart/form-data" class="mt-4">
    <div class="mb-3">
      <input name="file" type="file" accept="image/*" class="form-control" required>
    </div>

    <div class="text-center">
      <button type="submit" class="btn btn-primary">Upload</button>
    </div>
  </form>


  <!-- ========================= -->
  <!-- Operasi Aritmatika -->
  <!-- ========================= -->
  <h2 class="text-center mt-5">Operasi Aritmatika pada Citra</h2>

  <form action="/operation/" method="post" enctype="multipart/form-data" class="mt-4">

    <div class="mb-3">
      <label>Pilih Gambar:</label>
      <input name="file" type="file" accept="image/*" class="form-control" required>
    </div>

    <div class="mb-3">
      <label>Pilih Operasi:</label>
      <select name="operation" class="form-select">
        <option value="add">Tambah</option>
        <option value="subtract">Kurang</option>
        <option value="max">Max</option>
        <option value="min">Min</option>
        <option value="inverse">Inverse</option>
      </select>
    </div>

    <div class="mb-3">
      <label>Nilai Operasi:</label>
      <input type="range" min="0" max="100" step="1" name="value" id="value" class="form-range" value="50">
      <output id="valueOutput">50</output>
    </div>

    <div class="text-center">
      <button type="submit" class="btn btn-primary">Lakukan Operasi</button>
    </div>

  </form>


  <!-- ========================= -->
  <!-- Operasi Logika -->
  <!-- ========================= -->
  <h2 class="text-center mt-5">Operasi Logika pada Citra</h2>

  <form action="/logic_operation/" method="post" enctype="multipart/form-data" class="mt-4">

    <div class="mb-3">
      <label>Pilih Gambar 1:</label>
      <input name="file1" type="file" accept="image/*" class="form-control" required>
    </div>

    <div class="mb-3">
      <label>Pilih Gambar 2 (Opsional untuk AND / XOR):</label>
      <input name="file2" type="file" accept="image/*" class="form-control">
    </div>

    <div class="mb-3">
      <label>Pilih Operasi:</label>
      <select name="operation" class="form-select">
        <option value="not">NOT</option>
        <option value="and">AND</option>
        <option value="xor">XOR</option>
      </select>
    </div>

    <div class="text-center">
      <button type="submit" class="btn btn-primary">Lakukan Operasi Logika</button>
    </div>

  </form>


  <!-- ========================= -->
  <!-- Statistik -->
  <!-- ========================= -->
  <h2 class="text-center mt-5">Statistik Citra</h2>

  <form action="/statistics/" method="post" enctype="multipart/form-data" class="mt-4">

    <div class="mb-3">
      <label>Pilih Gambar:</label>
      <input name="file" type="file" accept="image/*" class="form-control" required>
    </div>

    <div class="text-center">
      <button type="submit" class="btn btn-primary">Hitung Statistik</button>
    </div>

  </form>


  <!-- ========================= -->
  <!-- Convolution -->
  <!-- ========================= -->
  <h2 class="text-center mt-5">Convolution</h2>

  <form action="/colab_operation/" method="post" enctype="multipart/form-data" class="mt-4">

    <div class="mb-3">
      <input name="file" type="file" class="form-control" required>
    </div>

    <input type="hidden" name="operation" value="convolution">

    <div class="mb-3">
      <label>Kernel:</label>
      <select name="kernel_type" class="form-select">
        <option value="average">Average</option>
        <option value="sharpen">Sharpen</option>
        <option value="edge">Edge Detection</option>
      </select>
    </div>

    <div class="text-center">
      <button type="submit" class="btn btn-success">Proses Convolution</button>
    </div>

  </form>


  <!-- ========================= -->
  <!-- Zero Padding -->
  <!-- ========================= -->
  <h2 class="text-center mt-5">Zero Padding</h2>

  <form action="/colab_operation/" method="post" enctype="multipart/form-data" class="mt-4">

    <div class="mb-3">
      <input name="file" type="file" class="form-control" required>
    </div>

    <input type="hidden" name="operation" value="padding">

    <div class="mb-3">
      <label>Padding Size:</label>
      <input type="number" name="padding_size" class="form-control" value="20">
    </div>

    <div class="text-center">
      <button type="submit" class="btn btn-success">Proses Padding</button>
    </div>

  </form>


  <!-- ========================= -->
  <!-- Filter -->
  <!-- ========================= -->
  <h2 class="text-center mt-5">Image Filter</h2>

  <form action="/colab_operation/" method="post" enctype="multipart/form-data" class="mt-4">

    <div class="mb-3">
      <input name="file" type="file" class="form-control" required>
    </div>

    <input type="hidden" name="operation" value="filter">

    <div class="mb-3">
      <label>Filter Type:</label>
      <select name="filter_type" class="form-select">
        <option value="low">Low Pass</option>
        <option value="high">High Pass</option>
        <option value="band">Band Pass</option>
      </select>
    </div>

    <div class="text-center">
      <button type="submit" class="btn btn-success">Proses Filter</button>
    </div>

  </form>


  <!-- ========================= -->
  <!-- Fourier -->
  <!-- ========================= -->
  <h2 class="text-center mt-5">Fourier Transform</h2>

  <form action="/colab_operation/" method="post" enctype="multipart/form-data" class="mt-4">

    <div class="mb-3">
      <input name="file" type="file" class="form-control" required>
    </div>

    <input type="hidden" name="operation" value="fourier">

    <div class="text-center">
      <button type="submit" class="btn btn-success">Proses Fourier</button>
    </div>

  </form>


  <!-- ========================= -->
  <!-- Periodic Noise -->
  <!-- ========================= -->
  <h2 class="text-center mt-5">Reduce Periodic Noise</h2>

  <form action="/colab_operation/" method="post" enctype="multipart/form-data" class="mt-4">

    <div class="mb-3">
      <input name="file" type="file" class="form-control" required>
    </div>

    <input type="hidden" name="operation" value="periodic_noise">

    <div class="text-center">
      <button type="submit" class="btn btn-success">Reduce Noise</button>
    </div>

  </form>

</div>


<script>
const slider = document.getElementById("value");
const output = document.getElementById("valueOutput");

if(slider){
  slider.addEventListener("input", function(){
    output.textContent = slider.value;
  });
}
</script>

{% endblock %}
